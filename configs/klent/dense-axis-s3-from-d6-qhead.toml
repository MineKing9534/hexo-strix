# Experimental S3 KLENT run using the checkpoint-compatible dense axis model.
#
# Start this output directory from the trained production Q-head checkpoint:
#
#   uv run hexo-klent train \
#     --config configs/klent/dense-axis-s3-from-d6-qhead.toml \
#     --init-from runs/gine-mini/4l-128p32v-lean-d6-qhead/checkpoints/checkpoint_00215547.pt
#
# Resume later with the ordinary KLENT checkpoint:
#
#   uv run hexo-klent train \
#     --config configs/klent/dense-axis-s3-from-d6-qhead.toml \
#     --resume latest \
#     --iterations 100
#
# Conversion copies the relational trunk and trained policy/Q heads. It does
# not initialize from the current S2 KLENT run, and AdamW starts fresh.

[model]
architecture = "dense_axis"
dense_ray_radius = 5

hidden_dim = 128
num_layers = 4
num_heads = 8
conv_type = "gine"
pre_norm = true
dropout = 0.0
use_jk = true
jk_mode = "cat"
policy_hidden = 128
q_hidden = 64

graph_type = "axis"
prune_empty_edges = true
threat_features = true
relative_stone_encoding = true
axis_relational = true
axis_window = 8
compact_stone_onehot = true
node_coords = false
moves_scope = "node"

[game]
win_length = 6
placement_radius = 6
rollout_horizon = 300

[algorithm]
alpha = 0.03
beta = 0.10
tau = 8.0

[collection]
positions_per_iteration = 32_768
parallel_games = 64
inference_batch_size = 64
# Dense budgets count padded raster cells rather than graph edges.
inference_edge_budget = 1_000_000
# Radius is local to existing stones, so a wandering game can create an
# enormous mostly-empty bounding box. Discard such games before their stored
# positions exceed the safe fit footprint; only terminal games enter FIT.
dense_position_cell_limit = 200_000
workers = 4
batch_timeout_ms = 2.0

[training]
# With fused line gather and active-cell MLP compaction, a matched 33x33 sweep
# measured about 387 positions/s at 512 and 388/s at 1024. Keep 512 for equal
# throughput with lower memory pressure.
batch_size = 512
# The effective optimizer batch remains 512 through gradient accumulation;
# this cap only bounds each dense forward/backward microbatch.
edge_budget = 200_000
grad_accumulation = true
prefetch_batches = true
learning_rate = 3e-4
weight_decay = 1e-4
q_loss_weight = 1.0
max_grad_norm = 1.5

[evaluation]
interval = 10

[[evaluation.opponents]]
name = "source_d6_qhead_215547"
kind = "checkpoint"
checkpoint = "runs/gine-mini/4l-128p32v-lean-d6-qhead/checkpoints/checkpoint_00215547.pt"
games = 32
placement_radius = 6
mcts_simulations = 24
mcts_actions = 8
opponent_mcts_simulations = 24
opponent_mcts_actions = 8

[[evaluation.opponents]]
name = "lag_25"
kind = "lagged"
lag_iterations = 25
games = 32
placement_radius = 6
mcts_simulations = 24
mcts_actions = 8

[[evaluation.opponents]]
name = "lag_100"
kind = "lagged"
lag_iterations = 100
games = 32
placement_radius = 6
mcts_simulations = 24
mcts_actions = 8

[[evaluation.opponents]]
name = "sealbot_r8_d2"
kind = "sealbot"
games = 16
depth = 2
placement_radius = 8
mcts_simulations = 24
mcts_actions = 8

[run]
iterations = 1_000
device = "cuda"
precision = "bf16"
compile = true
output_dir = "runs/klent/dense-axis-s3-from-d6-qhead"
checkpoint_interval = 5
seed = 0
