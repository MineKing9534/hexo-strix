# On-policy KLENT continuation from the restored epoch-19 fit of the
# graph220-distilled ten-block exact-D6 CNN. The distilled checkpoint contains
# fresh, empty AdamW state and KLENT iteration zero, so resume loads the native
# raster weights exactly while this config supplies the on-policy schedule:
#
#   .venv/bin/hexo-klent train \
#     --config configs/klent/hex-d6-dilated-cnn/s4-from-graph220-distilled-best19-klent.toml \
#     --resume runs/klent/hex-d6-dilated-cnn/s4-from-graph220-projected-10l-cont4/checkpoints/checkpoint_000000.pt \
#     --resume-configured-lr --tui
#
# The algorithm and optimizer settings match the successful joint graph stage:
# terminal-only self-play, tau=16, alpha=0.01, an effective batch of 2,048,
# LR 5e-5 with a five-generation warm-up, and unclipped finite-guarded updates.
# Raster safety bounds discard an entire non-terminal trajectory rather than
# allowing a horizon/spatial boundary target into FIT.
#
# Evaluation is intentionally tiered. CNN-vs-CNN start/lag probes run every
# five generations; best-so-far and shallow SealBot run every ten; graph220
# and depth-4 SealBot run every twenty. All checkpoint matches retain paired
# eight-ply openings with colour-swapped replay.

[model]
architecture = "hex_d6_dilated_cnn"
dense_ray_radius = 5

hidden_dim = 128
num_layers = 10
num_heads = 8
dropout = 0.0
policy_hidden = 128
q_hidden = 64

cnn_dilations = [1, 2, 4, 8, 1, 2, 4, 8, 1, 2]
cnn_expansion = 2

graph_type = "axis"
prune_empty_edges = true
threat_features = true
relative_stone_encoding = true
axis_relational = true
axis_window = 8
compact_stone_onehot = true
node_coords = false
moves_scope = "node"

[game]
win_length = 6
placement_radius = 8
rollout_horizon = 500

[algorithm]
alpha = 0.01
beta = 0.10
tau = 16.0

[collection]
positions_per_iteration = 131_072
# One full inference batch keeps the GPU fed while halving the number of
# incomplete games that must drain after the generated-position budget.
parallel_games = 256
inference_batch_size = 256
inference_edge_budget = 1_000_000
# Keep training play inside a D6-symmetric radius-20 hexagon. This has a
# 41x41 axial raster bound, but square crop buckets still shrink early states.
board_radius = 20
# Defensive invariant: a bounded game should never require more than 41x41.
dense_position_cell_limit = 1_681
workers = 4
batch_timeout_ms = 2.0

[training]
batch_size = 2_048
# The prior 500k-cell FIT crossed the old 64 GiB GTT ceiling. Keep the
# effective batch at 2,048 through accumulation while bounding each graph.
edge_budget = 125_000
policy_diagnostic_samples = 2_048
grad_accumulation = true
prefetch_batches = false
fit_max_autotune = false
fit_compile_seed_nodes = 0
learning_rate = 5e-5
learning_rate_warmup_iterations = 5
learning_rate_warmup_start_iteration = 0
learning_rate_warmup_start_factor = 0.1
weight_decay = 1e-4
q_loss_weight = 1.0
max_grad_norm = 0.0
critic_head_only = false
heads_only = false

[evaluation]
interval = 20
opening_plies = 8
opening_temperature = 0.5
opening_generator = "alternate"

[[evaluation.opponents]]
name = "distilled_start_best19"
kind = "checkpoint"
interval = 5
checkpoint = "runs/klent/hex-d6-dilated-cnn/s4-from-graph220-projected-10l-cont4/checkpoints/checkpoint_000000.pt"
games = 16
placement_radius = 8
mcts_simulations = 24
mcts_actions = 8
opponent_mcts_simulations = 24
opponent_mcts_actions = 8

[[evaluation.opponents]]
name = "lag_5"
kind = "lagged"
interval = 5
lag_iterations = 5
games = 16
placement_radius = 8
mcts_simulations = 24
mcts_actions = 8

[[evaluation.opponents]]
name = "best_so_far"
kind = "best_so_far"
interval = 10
checkpoint = "runs/klent/hex-d6-dilated-cnn/s4-from-graph220-projected-10l-cont4/checkpoints/checkpoint_000000.pt"
best_promotion_win_rate = 0.55
games = 32
placement_radius = 8
mcts_simulations = 24
mcts_actions = 8
opponent_mcts_simulations = 24
opponent_mcts_actions = 8

[[evaluation.opponents]]
name = "sealbot_r8_d2"
kind = "sealbot"
interval = 10
games = 8
depth = 2
placement_radius = 8
mcts_simulations = 24
mcts_actions = 8

[[evaluation.opponents]]
name = "source_graph_gen220"
kind = "checkpoint"
checkpoint = "runs/klent/axis-gine/s4-from-mc25-tau16-alpha001-full-batch2048/checkpoints/checkpoint_000220.pt"
games = 32
placement_radius = 8
mcts_simulations = 24
mcts_actions = 8
opponent_mcts_simulations = 24
opponent_mcts_actions = 8

[[evaluation.opponents]]
name = "sealbot_r8_d4"
kind = "sealbot"
games = 8
depth = 4
placement_radius = 8
mcts_simulations = 24
mcts_actions = 8

[run]
iterations = 200
device = "cuda"
precision = "bf16"
compile = true
output_dir = "runs/klent/hex-d6-dilated-cnn/s4-from-graph220-distilled-best19-klent"
checkpoint_interval = 1
seed = 6
