# Shared-trunk isolation arm continuing the protected Q-head-only checkpoint.
# Both KLENT output heads update, but the grafted Axis-GINE representation and
# its AdamW state remain bit-for-bit frozen. This directly separates harmful
# policy/Q targets from destructive movement through the shared trunk.
#
# The generation-20 source completed ten terminal Monte Carlo Q-only updates,
# retained the generation-10 policy/trunk exactly, tied its held critic, and
# preserved matched strength (+19 Elo, 95% CI [-18, +57], 326 games). This arm
# runs ten further terminal Monte Carlo generations with the policy head
# re-enabled while preserving that trunk.
#
#   .venv/bin/hexo-klent train \
#     --config configs/klent/axis-gine/s4-from-d6-qhead-lambda1-alpha001-heads-only-from-qhead20.toml \
#     --resume runs/klent/axis-gine/s4-from-d6-qhead-lambda1-alpha001-qhead-only-from10/checkpoints/checkpoint_000020.pt \
#     --resume-configured-lr \
#     --tui

[model]
architecture = "graph"

hidden_dim = 128
num_layers = 4
num_heads = 8
conv_type = "gine"
pre_norm = true
dropout = 0.0
use_jk = true
jk_mode = "cat"
policy_hidden = 128
q_hidden = 64

graph_type = "axis"
prune_empty_edges = true
threat_features = true
relative_stone_encoding = true
axis_relational = true
axis_window = 8
compact_stone_onehot = true
node_coords = false
moves_scope = "node"

[game]
win_length = 6
placement_radius = 8
rollout_horizon = 300

[algorithm]
alpha = 0.01
beta = 0.10
tau = inf

[collection]
positions_per_iteration = 131_072
parallel_games = 512
inference_batch_size = 256
inference_edge_budget = 250_000
workers = 4
batch_timeout_ms = 2.0

[training]
batch_size = 256
edge_budget = 250_000
policy_diagnostic_samples = 2_048
grad_accumulation = true
prefetch_batches = true
fit_max_autotune = true
fit_compile_seed_nodes = 16_384
learning_rate = 5e-5
weight_decay = 1e-4
q_loss_weight = 1.0
max_grad_norm = 0.0
heads_only = true

[evaluation]
interval = 5
opening_plies = 8
opening_temperature = 0.5
opening_generator = "alternate"

[[evaluation.opponents]]
name = "source_d6_qhead_215547"
kind = "checkpoint"
checkpoint = "runs/gine-mini/4l-128p32v-lean-d6-qhead/checkpoints/checkpoint_00215547.pt"
games = 32
placement_radius = 8
mcts_simulations = 24
mcts_actions = 8
opponent_mcts_simulations = 24
opponent_mcts_actions = 8

[[evaluation.opponents]]
name = "mc_start_gen10"
kind = "checkpoint"
checkpoint = "runs/klent/axis-gine/s4-from-d6-qhead-tau16-alpha001-noclip/checkpoints/checkpoint_000010.pt"
