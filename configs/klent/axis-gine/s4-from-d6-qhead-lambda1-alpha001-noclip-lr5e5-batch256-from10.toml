# Monte Carlo critic-calibration arm forked from generation 10 of the fresh
# tau=16, alpha=0.01, unclipped Axis-GINE run. This is matched to the completed
# batch-256 arm except that tau=inf makes lambda=exp(-1/tau) exactly 1.0.
# Every FIT sample now comes from a naturally completed game, so lambda=1 gives
# a full terminal Monte Carlo return at every played action. The position count
# is a soft budget; live games drain to a winner before fitting begins.
#
# Five generations (checkpoint 15) are the first diagnostic point. The initial
# run ends at generation 20 so that checkpoint 20 and the normal evaluation can
# decide whether to extend the MC warm-up or return to lambda=exp(-1/16).
#
#   uv run hexo-klent train \
#     --config configs/klent/axis-gine/s4-from-d6-qhead-lambda1-alpha001-noclip-lr5e5-batch256-from10.toml \
#     --resume runs/klent/axis-gine/s4-from-d6-qhead-tau16-alpha001-noclip/checkpoints/checkpoint_000010.pt \
#     --resume-configured-lr \
#     --tui
#
# Continue the same output later with the ordinary `--resume latest`.

[model]
architecture = "graph"

hidden_dim = 128
num_layers = 4
num_heads = 8
conv_type = "gine"
pre_norm = true
dropout = 0.0
use_jk = true
jk_mode = "cat"
policy_hidden = 128
q_hidden = 64

graph_type = "axis"
prune_empty_edges = true
threat_features = true
relative_stone_encoding = true
axis_relational = true
axis_window = 8
compact_stone_onehot = true
node_coords = false
moves_scope = "node"

[game]
win_length = 6
placement_radius = 8
rollout_horizon = 300

[algorithm]
alpha = 0.01
beta = 0.10
# Python's TOML parser accepts IEEE infinity. The configured mapping then gives
# exp(-1 / inf) = 1.0 without approximating Monte Carlo with a very large tau.
tau = inf

[collection]
positions_per_iteration = 131_072
parallel_games = 512
inference_batch_size = 256
inference_edge_budget = 250_000
workers = 4
batch_timeout_ms = 2.0

[training]
batch_size = 256
edge_budget = 250_000
policy_diagnostic_samples = 2_048
grad_accumulation = true
prefetch_batches = true
fit_max_autotune = true
fit_compile_seed_nodes = 16_384
learning_rate = 5e-5
weight_decay = 1e-4
q_loss_weight = 1.0
max_grad_norm = 0.0

[evaluation]
interval = 10
opening_plies = 8
opening_temperature = 0.5
opening_generator = "alternate"

[[evaluation.opponents]]
name = "source_d6_qhead_215547"
kind = "checkpoint"
checkpoint = "runs/gine-mini/4l-128p32v-lean-d6-qhead/checkpoints/checkpoint_00215547.pt"
games = 32
placement_radius = 8
mcts_simulations = 24
mcts_actions = 8
opponent_mcts_simulations = 24
opponent_mcts_actions = 8

[[evaluation.opponents]]
name = "best_so_far"
kind = "best_so_far"
checkpoint = "runs/klent/axis-gine/s4-from-d6-qhead-tau16-alpha001-noclip/checkpoints/checkpoint_000010.pt"
best_promotion_win_rate = 0.55
games = 32
placement_radius = 8
mcts_simulations = 24
mcts_actions = 8
opponent_mcts_simulations = 24
opponent_mcts_actions = 8

[[evaluation.opponents]]
name = "strix_jkcat_rel2_full"
kind = "checkpoint"
checkpoint = "runs/gine-mini/4l-128p32v-jkcat-rel2/checkpoints/checkpoint_00237000.pt"
games = 32
placement_radius = 8
mcts_simulations = 24
mcts_actions = 8
opponent_mcts_simulations = 24
opponent_mcts_actions = 8

[[evaluation.opponents]]
name = "lag_5"
kind = "lagged"
lag_iterations = 5
games = 32
placement_radius = 8
mcts_simulations = 24
mcts_actions = 8

[[evaluation.opponents]]
name = "sealbot_r8_d2"
kind = "sealbot"
games = 8
depth = 2
placement_radius = 8
mcts_simulations = 24
mcts_actions = 8

[[evaluation.opponents]]
name = "sealbot_r8_d4"
kind = "sealbot"
games = 8
depth = 4
placement_radius = 8
mcts_simulations = 24
mcts_actions = 8

[run]
iterations = 20
device = "cuda"
precision = "bf16"
compile = true
output_dir = "runs/klent/axis-gine/s4-from-d6-qhead-lambda1-alpha001-noclip-lr5e5-batch256-terminal-from10"
checkpoint_interval = 5
seed = 0
