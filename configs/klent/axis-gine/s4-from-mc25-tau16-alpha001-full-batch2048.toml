kind = "best_so_far"
checkpoint = "runs/klent/axis-gine/s4-from-d6-qhead-lambda1-alpha001-heads-only-batch2048-from-qhead20/checkpoints/checkpoint_000025.pt"
best_promotion_win_rate = 0.55
games = 32
