[package]
name = "hexo-engine"
version = "0.1.0"
edition = "2024"
authors = ["SootyOwl"]
description = "Game engine for HeXO — infinite hex tic-tac-toe on an unbounded hexagonal grid"
license = "MIT"
repository = "https://github.com/SootyOwl/hexo-engine"
readme = "../README.md"
keywords = ["hexagonal", "board-game", "tic-tac-toe", "game-engine"]
categories = ["games", "game-development"]

[features]
tui = ["crossterm", "ratatui"]

[dependencies]
rustc-hash = "2"
crossterm = { version = "0.29.0", optional = true }
ratatui = { version = "0.30.0", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "engine"
harness = false

# Golden reference: four-way hot-loop comparison (SipHash vs FxHashMap vs
# packed u64/u32 keys). Self-contained micro-benchmark with its own timing
# harness — the source of the B1/§0 speedup numbers. Run: cargo bench --bench
# bench_fourway. See docs/research/ and the HeXO perf plan.
[[bench]]
name = "bench_fourway"
harness = false

[[bin]]
name = "play"
required-features = ["tui"]
